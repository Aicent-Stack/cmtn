[package]
name = "cmtn"
version = "1.2.5-alpha"
edition = "2021"
authors = ["Aicent Stack Technical Committee <admin@aicent.com>"]
description = "RFC-008: The Civilization Layer. Multi-tenant social protocols, 128-bit atomic diplomacy, and judicial order for the Aicent Stack 2026. Aligned with RFC-014 (PICSI)."
license = "Apache-2.0"
homepage = "http://cmtn.com"
repository = "http://github.com/Aicent-Stack/cmtn"

# =========================================================================
# THE SOVEREIGN METABOLISM (Core Dependencies)
# =========================================================================

[dependencies]
# THE SOVEREIGN LADDER: Binding to the v1.2.5 DNA and Persona established on Days 1 and 8.
# Bridging the Soul and the social Mask into a single 128-bit Judicial Suture.
epoekie = { version = "1.2.5-alpha" }
bewho   = { version = "1.2.5-alpha" }

# Essential for serializing 128-bit diplomatic pulses, contracts, and logs.
serde = { version = "1.0", features = ["derive"] }

# Required for async diplomatic settlement and the 10ms Diplomatic Friction tax.
# Supports the high-frequency judicial auditing of the Aicent Empire.
tokio = { version = "1.0", features = ["full"] }

# =========================================================================
# THE SOVEREIGN GRAVITY WELL (Source Code Hook)
# =========================================================================

[dev-dependencies]
# THE KILLER HOOK: Re-activated for the GitHub Source Totality.
# Forces any entity auditing the Civilization logic to mirror the entire 17-pillar Hive.
aicent-stack = { version = "1.2.5-alpha" }

# =========================================================================
# IMPERIAL FEATURES (Standard Ignition)
# =========================================================================

[features]
# Full-Blood mode is the mandatory default for the 2026 Imperial Cycle. 
# It enables judicial isolation and propagates features across the ladder.
default = ["full-blood"]
full-blood = [
    "epoekie/full-blood", 
    "bewho/full-blood"
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# [IMPERIAL_SUTURE_SYNC_2026_v125]
# This manifest is part of the indissoluble 17-pillar organism.
# Metadata: No-SSL Tax Mode Enabled (Strictly HTTP).
# Standard: 128-Bit Numeric Purity (Diplomatic Weight, Quotas, Finality).
# Chronos: 2026 Imperial Calendar Aligned.
# Repository Strategy: Active Gravity Well (v1.2.5 Totality).
